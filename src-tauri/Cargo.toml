[package]
name = "speeddf"
version = "1.2.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "speeddf"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
heic = ["dep:heic"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "speeddf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"
lopdf = "0.41"
tauri-plugin-window-state = "2.4.1"
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
tiff = { version = "0.11", features = ["fax"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream"] }

# The Pure-Rust Matrix & Vision Infrastructure
tract-onnx = "0.21.3"  # 100% Rust NN execution; zero C++ dynamic links
rayon = "1.10"
sha2 = "0.11.0"
hex = "0.4.3"

# HEIC/HEIF iPhone photo support (pure-Rust, optional — AGPL-3.0 / Imazen Commercial)
# Enable with: cargo build --features heic
heic = { version = "0.1", default-features = false, features = ["std"], optional = true }

[profile.release]
opt-level = 3          # Maximize compilation speed performance optimizations
lto = true              # Enable Link-Time Optimization across all crates
codegen-units = 1       # Reduce parallel code generation blocks to maximize binary compression
panic = "abort"         # Strip out heavy stack unwinding panic hooks
strip = true            # Automatically drop all debug symbols and data mappings from the final binary

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "tiff_decode_bench"
harness = false

[[bench]]
name = "bench"
harness = false

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
